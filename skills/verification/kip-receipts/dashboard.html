<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kip sessions</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --panel: #fff; --fg: #1c1c1e; --dim: #6e6e73; --line: #e3e3e0;
  --accent: #2f6fe4; --accent-soft: #e6eefc; --ok: #1f8a4c; --warn: #b54708; --bad: #c4321f; --bad-soft: #fdecea;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --panel: #1b1b1e; --fg: #ececee; --dim: #8e8e93; --line: #2c2c30;
    --accent: #6c9cff; --accent-soft: #1e2a44; --ok: #4cc38a; --warn: #f5a524; --bad: #ff6b5e; --bad-soft: #3a1e1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0; }
.conn { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-left: auto; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.live .dot { background: var(--ok); }
label.toggle { color: var(--dim); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-height: calc(100vh - 53px); }
#list { border-right: 1px solid var(--line); overflow-y: auto; }
.card { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none;
  color: inherit; font: inherit; padding: 12px 16px; cursor: pointer; }
.card:hover { background: var(--panel); }
.card[aria-current="true"] { background: var(--accent-soft); }
.card.idle { opacity: .55; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub, .when { color: var(--dim); font-size: 12px; }
.tool { font-family: var(--mono); font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.loop { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-weight: 600; white-space: nowrap; }
#detail { padding: 20px 24px; overflow-y: auto; min-width: 0; }
.empty { color: var(--dim); padding: 40px 0; text-align: center; }
.meta { color: var(--dim); font-size: 12px; margin: 2px 0 16px; word-break: break-all; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 24px 0 8px; }
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; text-align: center; background: var(--panel); color: var(--dim); }
.step.reached { color: var(--fg); border-color: var(--accent); }
.step.current { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.step.current.stuck { background: var(--bad); border-color: var(--bad); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
summary { cursor: pointer; font-weight: 600; }
details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
ol.timeline { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 64px 64px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ev time { color: var(--dim); font-family: var(--mono); font-size: 12px; }
.ev .kind { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
.ev .text { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; min-width: 0; }
.ev.blocked .text, .ev.blocked .kind { color: var(--bad); }
.ev.skill .kind { color: var(--accent); }
.ev.fresh { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  #detail { padding: 16px; }
  .pipeline { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .step { padding: 6px 2px; font-size: 11px; }
  .ev { grid-template-columns: 58px 1fr; }
  .ev .kind { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Kip sessions</h1>
  <label class="toggle"><input type="checkbox" id="activeOnly"> Active only</label>
  <span class="conn" id="conn"><span class="dot"></span><span id="connText">connecting</span></span>
</header>
<main>
  <nav id="list" aria-label="Sessions"></nav>
  <section id="detail"><p class="empty">Pick a session.</p></section>
</main>
<script>
const STAGES = ["decompose", "implement", "tidy", "review", "receipts"];
const KIND = { tool: "tool", start: "start", stop: "stop", pr: "PR" };
let rows = [], selected = decodeURIComponent((location.hash.match(/session=([^&]+)/) || [])[1] || ""), events = [];
const $ = id => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : new Date(iso).toLocaleDateString();
}

function clock(iso) { return new Date(iso).toLocaleTimeString([], { hour12: false }); }

function remember(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }

function renderList() {
  const activeOnly = $("activeOnly").checked;
  const shown = rows.filter(r => !activeOnly || r.active || r.session === selected);
  $("list").replaceChildren(...(shown.length ? shown.map(r => h("button", {
      class: "card" + (r.active ? "" : " idle"), "aria-current": r.session === selected ? "true" : "false",
      onclick: () => select(r.session),
    },
    h("div", { class: "row" },
      h("div", { class: "grow title" }, r.repo || "unknown repo", r.branch ? h("span", { class: "sub" }, " · " + r.branch) : null),
      r.blocked ? h("span", { class: "loop", title: "stops in a row the gate blocked" }, "↻ " + r.blocked) : null,
      r.stage ? h("span", { class: "chip" }, r.stage) : null),
    h("div", { class: "row" }, h("span", { class: "sub grow" }, `${r.host || "?"} · ${r.session.slice(0, 8)}`), h("span", { class: "when", "data-at": r.last }, ago(r.last))),
    r.tool ? h("div", { class: "tool" }, r.tool) : null))
    : [h("p", { class: "empty" }, "No sessions yet. They appear as agents run.")]));
}

function eventItem(e, fresh) {
  const blocked = e.blocked === true, skill = e.hook === "tool" && e.tool === "Skill";
  const text = e.hook === "tool" ? (skill ? e.input : `${e.tool}${e.input ? "  " + e.input : ""}`)
    : e.message || (e.hook === "stop" ? "stop allowed" : e.hook);
  return h("li", { class: `ev${blocked ? " blocked" : ""}${skill ? " skill" : ""}${fresh ? " fresh" : ""}` },
    h("time", { datetime: e.at }, clock(e.at)),
    h("span", { class: "kind" }, skill ? "skill" : blocked ? "blocked" : KIND[e.hook] || e.hook),
    h("span", { class: "text" }, text));
}

function renderDetail(full) {
  const r = rows.find(x => x.session === selected);
  if (!r) { $("detail").replaceChildren(h("p", { class: "empty" }, selected ? "That session isn't in the log." : "Pick a session.")); return; }
  const expanded = new Set([...document.querySelectorAll("#head details[open]")].map(d => d.dataset.kind));
  const open = Object.entries(r.open || {});
  const head = [
    h("h2", {}, r.repo || "unknown repo", r.branch ? h("span", { class: "sub" }, " · " + r.branch) : null),
    h("p", { class: "meta" }, `${r.host} · ${r.session} · last seen ${ago(r.last)}${r.run ? " · run " + r.run.split("/").pop() : ""}`),
    h("div", { class: "pipeline", role: "list", "aria-label": "Stages" }, STAGES.map(s => h("div", {
      role: "listitem",
      class: "step" + ((r.reached || []).includes(s) ? " reached" : "") + (r.stage === s ? " current" + (r.blocked ? " stuck" : "") : ""),
    }, s, r.stage === s && r.blocked ? ` ↻${r.blocked}` : ""))),
    h("h3", {}, open.length ? "Open in this run" : r.run ? "Run: nothing open (stale evidence shows in the gate's messages)" : "No receipts run"),
    open.map(([kind, lines]) => h("details", { "data-kind": kind, open: expanded.has(kind) ? "" : null },
      h("summary", {}, `${kind} (${lines.length})`), h("ul", {}, lines.map(l => h("li", {}, l)))))];
  if (!full && $("head")) return $("head").replaceChildren(...head.flat());
  $("detail").replaceChildren(h("div", { id: "head" }, head), h("h3", {}, "Timeline"),
    h("ol", { class: "timeline", id: "timeline" }, events.slice().reverse().map(e => eventItem(e))));
}

async function refresh() {
  try {
    rows = await (await fetch("/api/sessions")).json();
    renderList();
    if (selected) renderDetail();
  } catch (_) {}
}

async function select(id) {
  selected = id;
  history.replaceState(null, "", "#session=" + encodeURIComponent(id));
  events = await (await fetch("/api/sessions/" + encodeURIComponent(id))).json();
  renderList();
  renderDetail(true);
  if (matchMedia("(max-width: 760px)").matches) $("detail").scrollIntoView({ behavior: "smooth" });
}

let pending;
function soon() { clearTimeout(pending); pending = setTimeout(refresh, 300); }

function connect() {
  const es = new EventSource("/stream");
  es.onopen = () => { $("conn").classList.add("live"); $("connText").textContent = "live"; refresh(); };
  es.onerror = () => { $("conn").classList.remove("live"); $("connText").textContent = "reconnecting"; };
  es.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch (_) { return; }
    if (String(e.session) === selected) {
      events.push(e);
      const tl = $("timeline");
      if (tl) tl.prepend(eventItem(e, true));
    }
    soon();
  };
}

$("activeOnly").checked = recall("kip.activeOnly") === "1";
$("activeOnly").addEventListener("change", () => { remember("kip.activeOnly", $("activeOnly").checked ? "1" : "0"); renderList(); });
setInterval(() => document.querySelectorAll("[data-at]").forEach(el => el.textContent = ago(el.dataset.at)), 15000);
refresh().then(() => selected && select(selected));
connect();
</script>
</body>
</html>
