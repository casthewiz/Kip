<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kip</title>
<link rel="icon" href="/kip-waiting.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --panel: #fff; --fg: #1c1c1e; --dim: #6e6e73; --line: #e3e3e0;
  --accent: #2f6fe4; --accent-soft: #e6eefc; --ok: #1f8a4c; --warn: #b54708; --bad: #c4321f; --bad-soft: #fdecea;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --panel: #1b1b1e; --fg: #ececee; --dim: #8e8e93; --line: #2c2c30;
    --accent: #6c9cff; --accent-soft: #1e2a44; --ok: #4cc38a; --warn: #f5a524; --bad: #ff6b5e; --bad-soft: #3a1e1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0; }
.conn { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-left: auto; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.live .dot { background: var(--ok); }
label.toggle { color: var(--dim); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-height: calc(100vh - 53px); }
#list { border-right: 1px solid var(--line); overflow-y: auto; }
.card { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none;
  color: inherit; font: inherit; padding: 12px 16px; cursor: pointer; }
.mascot { flex: none; image-rendering: pixelated; }
.card:hover { background: var(--panel); }
.card[aria-current="true"] { background: var(--accent-soft); }
.card.idle { opacity: .55; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon { display: inline-block; width: 1em; height: 1em; vertical-align: -.125em; margin-right: 6px; color: var(--dim); }
.icon svg { width: 100%; height: 100%; fill: currentColor; }
a.icon:hover { color: var(--accent); }
.sub, .when { color: var(--dim); font-size: 12px; }
.tool { font-family: var(--mono); font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.loop { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-weight: 600; white-space: nowrap; }
#detail { padding: 20px 24px; overflow-y: auto; min-width: 0; }
.empty { color: var(--dim); padding: 40px 0; text-align: center; }
.meta { color: var(--dim); font-size: 12px; margin: 2px 0 16px; word-break: break-all; }
h2 { font-size: 18px; margin: 0; }
.headline { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.headline .meta { margin-bottom: 0; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 24px 0 8px; }
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; text-align: center; background: var(--panel); color: var(--dim); }
.step.reached { color: var(--fg); border-color: var(--accent); }
.step.current { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.step.current.stuck { background: var(--bad); border-color: var(--bad); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
summary { cursor: pointer; font-weight: 600; }
details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
ol.timeline { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 64px 64px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ev time { color: var(--dim); font-family: var(--mono); font-size: 12px; }
.ev .kind { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
.ev .text { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; min-width: 0; }
.ev details { background: none; border: 0; padding: 0; margin: 0; }
.ev summary { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev details[open] summary { color: var(--dim); margin-bottom: 4px; }
.ev.blocked .text, .ev.blocked .kind { color: var(--bad); }
.ev.skill .kind { color: var(--accent); }
.ev.said .text { font: 13px/1.5 system-ui, -apple-system, sans-serif; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; }
.ev.prompt .text { border-left: 3px solid var(--accent); }
.ev.prompt .kind { color: var(--accent); }
.ev.said .text.long { max-height: 9em; overflow: hidden; cursor: pointer; position: relative; }
.ev.said .text.long::after { content: "show all"; position: absolute; right: 0; bottom: 0; padding: 2px 12px 4px 32px;
  font-size: 12px; color: var(--accent); background: linear-gradient(to right, transparent, var(--panel) 24px); }
.ev.said .text.long.open { max-height: none; }
.ev.said .text.long.open::after { content: "show less"; position: static; display: block; padding: 4px 0 0; background: none; }
.ev.fresh { animation: flash 1.2s ease-out; }
.segments { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 20px; }
.segment { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.segment h3 { margin: 0 0 8px; }
.segment ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.segment li { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; min-width: 0; }
.segment li .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segment .none { color: var(--dim); font-size: 12px; margin: 0; }
.kindtag { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--dim); flex: none; }
.n { color: var(--dim); font-size: 12px; flex: none; }
a { color: var(--accent); }
.runs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.runs button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: inherit;
  border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; }
.runs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tally { display: inline-flex; gap: 4px; margin-left: 6px; }
.v { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; flex: none; }
.v.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.v.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.v.bad { background: var(--bad-soft); color: var(--bad); }
.claim summary { display: flex; gap: 8px; align-items: baseline; font-weight: 400; }
.claim summary .cid { font-family: var(--mono); font-size: 12px; color: var(--dim); flex: none; }
.claim summary .grow { min-width: 0; }
.claim .tags { color: var(--dim); font-size: 11px; }
.evidence { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; }
.evidence > li { border-top: 1px solid var(--line); padding: 8px 0; }
.evidence code { font-family: var(--mono); word-break: break-word; }
.evidence .cmd { display: block; margin-top: 4px; max-height: 4.4em; overflow: hidden; cursor: pointer; color: var(--dim); }
.evidence .cmd.open { max-height: none; }
.evidence pre { font-family: var(--mono); font-size: 12px; background: var(--bg); border-radius: 6px; padding: 8px;
  overflow-x: auto; max-height: 16em; margin: 6px 0 0; }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
.media img, .media video { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); display: block; }
.media img { cursor: zoom-in; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; }
.media figure { margin: 0; min-width: 0; }
.media figcaption { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog#zoom { border: 0; padding: 0; background: none; max-width: 96vw; max-height: 96vh; }
dialog#zoom::backdrop { background: rgb(0 0 0 / .75); }
dialog#zoom img { max-width: 96vw; max-height: 96vh; display: block; cursor: zoom-out; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--dim); padding: 4px 12px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.state { font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
.state.open { background: var(--accent-soft); color: var(--accent); }
.state.finished { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.state.orphaned { background: var(--line); color: var(--dim); }
.loop.past { background: var(--line); color: var(--dim); font-weight: 400; }
.flags { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.sha { font-family: var(--mono); font-size: 12px; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  #detail { padding: 16px; }
  .pipeline { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .step { padding: 6px 2px; font-size: 11px; }
  .ev { grid-template-columns: 58px 1fr; }
  .ev .kind { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Kip</h1>
  <nav class="tabs" aria-label="View"><button id="tabSessions">Sessions</button><button id="tabRuns">Runs</button></nav>
  <label class="toggle"><input type="checkbox" id="activeOnly"> <span id="filterText">Active only</span></label>
  <span class="conn" id="conn"><span class="dot"></span><span id="connText">connecting</span></span>
</header>
<main>
  <nav id="list" aria-label="List"></nav>
  <section id="detail"><p class="empty">Pick a session.</p></section>
  <dialog id="zoom"><img alt=""></dialog>
</main>
<script>
const STAGES = ["decompose", "implement", "tidy", "review", "receipts"];
const KIND = { tool: "tool", start: "start", stop: "stop", pr: "PR", prompt: "prompt", response: "reply" };
const fromHash = key => decodeURIComponent((location.hash.match(new RegExp(key + "=([^&]+)")) || [])[1] || "");
let rows = [], selected = fromHash("session"), events = [];
let runs = [], runSelected = fromHash("run"), view = runSelected || location.hash === "#runs" ? "runs" : "sessions";
const $ = id => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : new Date(iso).toLocaleDateString();
}

function clock(iso) { return new Date(iso).toLocaleTimeString([], { hour12: false }); }

function remember(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }

const ICONS = {
  folder: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.22.78 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2A1.75 1.75 0 0 0 5 1H1.75Z"/></svg>',
  github: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>',
};

// The repo's name after a folder icon, or GitHub's mark when it's on GitHub (a link to it where links can go).
function title(r, link) {
  const icon = r.github && link ? h("a", { class: "icon", href: r.github, target: "_blank", rel: "noopener", title: r.github })
    : h("span", { class: "icon", title: r.github || "directory" });
  icon.innerHTML = ICONS[r.github ? "github" : "folder"];
  return [icon, r.repo || "unknown repo", r.branch ? h("span", { class: "sub" }, " · " + r.branch) : null];
}

const MOODS = { waiting: "idle", working: "working", asking: "needs you: an unverified claim, no PR or accept yet",
  success: "the gate let its turn end", failure: "blocked by the gate, or a claim is failing" };

// Kip as the session stands: blocked or failing a claim, mid-turn, asking the user to settle an unverified claim,
// let stop by the gate or done with its run, or idle.
function mood(r) {
  if (r.blocked) return "failure";
  if (r.active && r.hook !== "stop" && r.hook !== "start") return "working";
  const run = r.run && (r.runs || []).find(x => x.id === r.run.split("/").pop());
  if (run && run.finished) return "success";
  if (run && Object.keys(run.claims).some(v => v.startsWith("❌"))) return "failure";
  if (run && run.asking && !r.pr) return "asking";
  return r.hook === "stop" ? "success" : "waiting";
}

function mascot(r, size) {
  const m = mood(r);
  return h("img", { class: "mascot", src: `/kip-${m}.svg`, width: size, height: size, alt: "Kip: " + MOODS[m], title: MOODS[m] });
}

function renderList() {
  $("tabSessions").setAttribute("aria-pressed", view === "sessions");
  $("tabRuns").setAttribute("aria-pressed", view === "runs");
  $("filterText").textContent = view === "runs" ? "Needs attention" : "Active only";
  if (view === "runs") return renderRuns();
  const activeOnly = $("activeOnly").checked;
  const shown = rows.filter(r => !activeOnly || r.active || r.session === selected);
  $("list").replaceChildren(...(shown.length ? shown.map(r => h("button", {
      class: "card" + (r.active ? "" : " idle"), "aria-current": r.session === selected ? "true" : "false",
      onclick: () => select(r.session),
    },
    mascot(r, 40),
    h("div", { class: "grow" },
      h("div", { class: "row" },
        h("div", { class: "grow title" }, title(r)),
        r.blocked ? h("span", { class: "loop", title: "stops in a row the gate blocked" }, "↻ " + r.blocked) : null,
        r.stage ? h("span", { class: "chip" }, r.stage) : null),
      h("div", { class: "row" }, h("span", { class: "sub grow" }, `${r.host || "?"} · ${r.session.slice(0, 8)}`), h("span", { class: "when", "data-at": r.last }, ago(r.last))),
      r.tool ? h("div", { class: "tool" }, r.tool) : null)))
    : [h("p", { class: "empty" }, "No sessions yet. They appear as agents run.")]));
}

const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

// As few characters as say what a row did: the tool and the gist of its input, or the first line of the rest.
function gist(e, text) {
  if (e.hook !== "tool" || e.tool === "Skill") return cut(text.trim().split("\n")[0], 60);
  const name = e.tool.replace(/^mcp__.+?__|^MCP:/, ""), input = (e.input || "").trim();
  const arg = input.startsWith("{") ? "" : /^[/~]/.test(input) ? input.split("/").filter(Boolean).pop()
    : input.replace(/^cd \S+ && /, "").split(/[|;&\n]/)[0].trim().split(/\s+/).filter(w => !w.startsWith("-")).slice(0, 2).join(" ");
  return cut(arg ? `${name} ${arg}` : name, 40);
}

function eventItem(e, fresh) {
  const blocked = e.blocked === true, skill = e.hook === "tool" && e.tool === "Skill", said = "text" in e, prompt = e.hook === "prompt";
  const text = said ? e.text : e.hook === "tool" ? (skill ? e.input : `${e.tool}${e.input ? "  " + e.input : ""}`)
    : e.message || (e.hook === "stop" ? "stop allowed" : e.hook);
  const long = prompt && (text.length > 600 || text.split("\n").length > 6);
  return h("li", { class: `ev${blocked ? " blocked" : ""}${skill ? " skill" : ""}${said ? " said " + e.hook : ""}${fresh ? " fresh" : ""}` },
    h("time", { datetime: e.at }, clock(e.at)),
    h("span", { class: "kind" }, skill ? "skill" : blocked ? "blocked" : KIND[e.hook] || e.hook),
    h("span", { class: "text" + (long ? " long" : ""), onclick: long && (ev => ev.currentTarget.classList.toggle("open")) },
      prompt || blocked ? text : h("details", {}, h("summary", {}, gist(e, text)), text)));
}

const tone = v => v.startsWith("✅") ? "ok" : v.startsWith("❌") ? "bad" : "warn";
const link = (href, text) => href ? h("a", { href, target: "_blank", rel: "noopener" }, text) : text;
let review = null;  // the run open in the review panel: { id, body, data }

function tally(counts) {
  return h("span", { class: "tally" }, Object.entries(counts || {}).map(([v, n]) => h("span", { class: "v " + tone(v), title: v }, `${v.split(" ")[0]} ${n}`)));
}

function segment(name, items, none) {
  return h("div", { class: "segment" }, h("h3", {}, name), items.length ? h("ul", {}, items) : h("p", { class: "none" }, none));
}

// What the session touched beyond the repo: the issues it's tied to, where its receipts go, what it read from outside.
function segments(r) {
  const sinks = new Map();
  for (const x of r.runs || []) for (const s of x.sinks) sinks.set(s.name + " " + (s.url || ""), s);
  return h("div", { class: "segments" },
    segment("Issues", (r.issues || []).map(i => h("li", {}, h("span", { class: "grow" }, i.key), h("span", { class: "n" }, "via " + i.via))),
      "No Linear, Jira or GitHub issue: no run publishes to one, and no tracker call named one."),
    segment("Sinks", [...sinks.values()].map(s => h("li", {}, h("span", { class: "grow" }, link(s.url, s.name)),
      h("span", { class: "n" }, s.url ? "published" : s.name === "local" ? "kip.db" : "not published yet"))),
      "No receipts run, so nothing is recorded or published."),
    segment("Sources", (r.sources || []).map(s => h("li", { title: s.name }, h("span", { class: "kindtag" }, s.kind),
      h("span", { class: "grow" }, s.kind === "web" || s.kind === "link" ? link(s.name, s.name) : s.name), h("span", { class: "n" }, "×" + s.count))),
      "No web, search or MCP calls, and no links in prompts."));
}

function receipts(r) {
  const open = Object.entries(r.open || {}), expanded = new Set([...document.querySelectorAll("#head details[open]")].map(d => d.dataset.kind));
  return [h("h3", {}, "Receipts"),
    (r.runs || []).length ? h("div", { class: "runs" }, r.runs.slice().reverse().map(x => h("button", {
      "aria-pressed": review && review.id === x.id ? "true" : "false", onclick: () => openRun(x.id) },
      x.id, x.branch ? " · " + x.branch : "", x.finished ? " · finished" : "", tally(x.claims))))
      : h("p", { class: "none" }, "No receipts run in this session."),
    open.length ? h("p", { class: "meta" }, "Open in run " + r.run.split("/").pop()) : null,
    open.map(([kind, lines]) => h("details", { "data-kind": kind, open: expanded.has(kind) ? "" : null },
      h("summary", {}, `${kind} (${lines.length})`), h("ul", {}, lines.map(l => h("li", {}, l)))))];
}

function fileItem(f) {
  const view = f.type === "image" ? h("img", { src: f.url, alt: f.name, loading: "lazy", onclick: () => zoom(f.url, f.name) })
    : f.type === "video" ? h("video", { src: f.url, controls: "", preload: "metadata" }) : null;
  return h("figure", {}, view, h("figcaption", { title: f.name }, link(f.url, view ? f.name : `${f.type}: ${f.name}`)));
}

function claimItem(c, open) {
  const tags = [c.unit && "unit " + c.unit, c.stage, c.provider, c.files.length && `${c.files.length} file${c.files.length > 1 ? "s" : ""}`];
  return h("details", { class: "claim", "data-claim": c.id, open: open ? "" : null },
    h("summary", {}, h("span", { class: "v " + tone(c.verdict) }, c.verdict.split(":")[0]), h("span", { class: "cid" }, c.id),
      h("span", { class: "grow" }, c.text, " ", h("span", { class: "tags" }, tags.filter(Boolean).join(" · ")))),
    c.unverified || c.verdict.includes(":") ? h("p", { class: "meta" }, c.unverified ? "unverified: " + c.unverified + (c.accepted ? " (accepted)" : "") : c.verdict) : null,
    c.evidence.length ? h("ul", { class: "evidence" }, c.evidence.map(e => h("li", {},
      h("span", { class: "v " + (e.passed ? "ok" : "bad") }, (e.phase === "red" ? "red · " : "") + (e.passed ? "passed" : "failed")), " ",
      e.label ? h("strong", {}, e.label) : null,
      h("code", { class: "cmd", title: "click to show all", onclick: ev => ev.currentTarget.classList.toggle("open") }, e.summary),
      h("div", { class: "n" }, e.remote ? "remote" : e.commit ? "commit " + e.commit.slice(0, 7) : "",
        e.log ? [" · ", link(e.log, "log")] : null, e.patch ? [" · ", link(e.patch, "patch")] : null),
      e.excerpt ? h("pre", {}, e.excerpt) : null))) : h("p", { class: "none" }, "No evidence yet."),
    c.files.length ? h("div", { class: "media" }, c.files.map(fileItem)) : null);
}

function renderReview() {
  const el = $("review");
  if (!el) return;
  if (!review || !review.data) return el.replaceChildren();
  const d = review.data, expanded = new Set(el.dataset.run === d.id ? [...el.querySelectorAll("details[open]")].map(x => x.dataset.claim) : []);
  el.dataset.run = d.id;
  el.replaceChildren(h("div", {}, h("p", { class: "meta" }, `run ${d.id} · ${d.level} · ${d.target || "commit " + (d.commit || "?").slice(0, 7)}`),
    d.claims.length ? d.claims.map(c => claimItem(c, expanded.has(c.id))) : h("p", { class: "none" }, "No claims yet.")));
}

// Fetch a run for review; redraw only when it changed, so a playing video or an open claim survives live updates.
async function openRun(id) {
  if (!review || review.id !== id) { review = { id }; if (view === "sessions") { renderDetail(); renderReview(); } }
  let body;
  try { body = await (await fetch("/api/runs/" + encodeURIComponent(id))).text(); } catch (_) { return; }
  if (review?.id !== id || body === review.body) return;
  try { review = { id, body, data: JSON.parse(body) }; } catch (_) { return; }
  if (view === "runs") renderUnits(); else renderReview();
}

function zoom(src, alt) {
  const img = $("zoom").querySelector("img");
  img.src = src; img.alt = alt;
  $("zoom").showModal();
}

function renderDetail(full) {
  const r = rows.find(x => x.session === selected);
  if (!r) { $("detail").replaceChildren(h("p", { class: "empty" }, selected ? "That session isn't in the log." : "Pick a session.")); return; }
  const head = [
    h("div", { class: "headline" }, mascot(r, 64), h("div", { class: "grow" },
      h("h2", {}, title(r, true)),
      h("p", { class: "meta" }, `${r.host} · ${r.session} · last seen ${ago(r.last)} · ${MOODS[mood(r)]}`))),
    h("div", { class: "pipeline", role: "list", "aria-label": "Stages" }, STAGES.map(s => h("div", {
      role: "listitem",
      class: "step" + ((r.reached || []).includes(s) ? " reached" : "") + (r.stage === s ? " current" + (r.blocked ? " stuck" : "") : ""),
    }, s, r.stage === s && r.blocked ? ` ↻${r.blocked}` : ""))),
    segments(r),
    receipts(r)];
  if (!full && $("head")) return $("head").replaceChildren(...head.flat(Infinity).filter(x => x != null));
  $("detail").replaceChildren(h("div", { id: "head" }, head), h("div", { id: "review" }), h("h3", {}, "Timeline"),
    h("ol", { class: "timeline", id: "timeline" }, events.slice().reverse().map(e => eventItem(e))));
  renderReview();
}

async function refresh() {
  try {
    rows = await (await fetch("/api/sessions")).json();
    if (view === "runs") runs = await (await fetch("/api/runs")).json();
    renderList();
    if (view === "runs") renderRunDetail(); else if (selected) renderDetail();
  } catch (_) {}
}

async function select(id) {
  view = "sessions";
  selected = id;
  review = null;
  history.replaceState(null, "", "#session=" + encodeURIComponent(id));
  events = await (await fetch("/api/sessions/" + encodeURIComponent(id))).json();
  renderList();
  renderDetail(true);
  const r = rows.find(x => x.session === id), latest = r && r.run && r.run.split("/").pop();
  if (latest && r.runs.some(x => x.id === latest)) openRun(latest);
  if (matchMedia("(max-width: 760px)").matches) $("detail").scrollIntoView({ behavior: "smooth" });
}

const short = sha => sha ? sha.slice(0, 7) : "—";

function renderRuns() {
  const flaggedOnly = $("activeOnly").checked;
  const shown = runs.filter(x => !flaggedOnly || x.attention || x.id === runSelected);
  $("list").replaceChildren(...(shown.length ? shown.map(x => h("button", {
      class: "card", "aria-current": x.id === runSelected ? "true" : "false", onclick: () => selectRun(x.id) },
    h("div", { class: "grow" },
      h("div", { class: "row" },
        h("div", { class: "grow title" }, title(x)),
        x.flags.length ? h("span", { class: "loop" + (x.attention ? "" : " past"), title: x.flags.join("\n") }, "⚑ " + x.flags.length) : null,
        h("span", { class: `state ${x.state}` }, x.state)),
      h("div", { class: "row" }, h("span", { class: "sub grow" }, `${x.id} · ${x.level}`),
        h("span", { class: "when", "data-at": x.created_at }, ago(x.created_at))),
      h("div", { class: "row" }, tally(x.claims)))))
    : [h("p", { class: "empty" }, flaggedOnly ? "No open run needs attention." : "No receipts runs yet.")]));
}

const sessionLink = sid => h("a", { href: "#session=" + encodeURIComponent(sid), onclick: ev => { ev.preventDefault(); select(sid); } },
  sid.slice(0, 8));

// A run for triage: how it stands and settled, the commits it covers, who wrote it and who only shared its branch,
// then its claims by unit.
function renderRunDetail() {
  const x = runs.find(r => r.id === runSelected);
  if (!x) { $("detail").replaceChildren(h("p", { class: "empty" }, runSelected ? "That run isn't in kip.db." : "Pick a run.")); return; }
  const how = x.state === "open" ? "" : ` · ${x.via || "how unknown"}${x.reason && x.via !== x.reason ? ": " + x.reason : ""}`;
  const writers = Object.entries(x.writers).sort((a, b) => b[1] - a[1]);
  const head = [
    h("div", { class: "headline" }, h("div", { class: "grow" }, h("h2", {}, title(x)),
      h("p", { class: "meta" }, `run ${x.id} · ${x.level} · started ${ago(x.created_at)}`, " · ", h("span", { class: `state ${x.state}` }, x.state), how))),
    x.flags.length ? h("ul", { class: "flags", title: x.attention ? "" : "settled: these are history" },
      x.flags.map(f => h("li", { class: "loop" + (x.attention ? "" : " past") }, f))) : null,
    h("div", { class: "segments" },
      segment("Commits", [["started on", x.commits.start], ["left the base at", x.commits.fork], ["published at", x.commits.published],
        ["finished at", x.commits.finished]].map(([what, sha]) => h("li", {}, h("span", { class: "grow" }, what), h("span", { class: "sha", title: sha || "" }, short(sha)))), ""),
      segment("Wrote it", [...writers.map(([sid, n]) => h("li", {}, h("span", { class: "grow" }, sessionLink(sid)), h("span", { class: "n" }, `${n} write${n > 1 ? "s" : ""}`))),
        x.unknown_writes ? h("li", {}, h("span", { class: "grow" }, "no session recorded"), h("span", { class: "n" }, `${x.unknown_writes} write${x.unknown_writes > 1 ? "s" : ""}`)) : null].filter(Boolean),
        "No writes yet."),
      segment("Only on its branch", x.branch_only.map(sid => h("li", {}, h("span", { class: "grow" }, sessionLink(sid)), h("span", { class: "n" }, "wrote nothing"))),
        "No session saw this run on its branch without writing to it.")),
    h("div", { id: "review" })];
  const keep = $("detail").dataset.run === x.id && $("review");
  if (keep) return $("detail").firstChild.replaceWith(h("div", {}, head.slice(0, -1)));
  $("detail").dataset.run = x.id;
  $("detail").replaceChildren(h("div", {}, head.slice(0, -1)), head.at(-1));
  renderUnits();
}

// The run's claims grouped by the kip-decompose unit each belongs to; claims without one come last.
function renderUnits() {
  const el = $("review");
  if (!el || !review || review.id !== runSelected || !review.data) return;
  const expanded = new Set([...el.querySelectorAll("details[open]")].map(d => d.dataset.claim)), groups = new Map();
  for (const c of review.data.claims) groups.set(c.unit || "", [...(groups.get(c.unit || "") || []), c]);
  const order = [...groups.keys()].sort((a, b) => !a - !b || a.localeCompare(b, undefined, { numeric: true }));
  el.replaceChildren(...(order.length ? order.map(u => [h("h3", {}, u ? "Unit " + u : "No unit"), groups.get(u).map(c => claimItem(c, expanded.has(c.id)))]).flat(2)
    : [h("p", { class: "none" }, "No claims yet.")]));
}

async function selectRun(id) {
  view = "runs";
  runSelected = id;
  history.replaceState(null, "", "#run=" + encodeURIComponent(id));
  if (!runs.length) runs = await (await fetch("/api/runs")).json();
  renderList();
  renderRunDetail();
  await openRun(id);
  if (matchMedia("(max-width: 760px)").matches) $("detail").scrollIntoView({ behavior: "smooth" });
}

$("zoom").addEventListener("click", () => $("zoom").close());

let pending;
function soon() { clearTimeout(pending); pending = setTimeout(refresh, 300); }

function connect() {
  const es = new EventSource("/stream");
  es.onopen = () => { $("conn").classList.add("live"); $("connText").textContent = "live"; refresh(); };
  es.onerror = () => { $("conn").classList.remove("live"); $("connText").textContent = "reconnecting"; };
  es.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch (_) { return; }
    if (view === "runs" && review) openRun(review.id);
    else if (String(e.session) === selected) {
      if (review) openRun(review.id);
      events.push(e);
      const tl = $("timeline");
      if (tl) tl.prepend(eventItem(e, true));
    }
    soon();
  };
}

const filterKey = () => view === "runs" ? "kip.flaggedOnly" : "kip.activeOnly";
function show(next) {
  view = next;
  $("activeOnly").checked = recall(filterKey()) === "1";
  if (next === "runs") { history.replaceState(null, "", runSelected ? "#run=" + encodeURIComponent(runSelected) : "#runs"); refresh(); }
  else if (selected) select(selected); else { history.replaceState(null, "", "#"); renderList(); renderDetail(true); }
}
$("tabSessions").addEventListener("click", () => show("sessions"));
$("tabRuns").addEventListener("click", () => show("runs"));
$("activeOnly").checked = recall(filterKey()) === "1";
$("activeOnly").addEventListener("change", () => { remember(filterKey(), $("activeOnly").checked ? "1" : "0"); renderList(); });
setInterval(() => document.querySelectorAll("[data-at]").forEach(el => el.textContent = ago(el.dataset.at)), 15000);
refresh().then(() => view === "runs" ? runSelected && selectRun(runSelected) : selected && select(selected));
connect();
</script>
</body>
</html>
