name: Kip receipts
description: Fail a pull request whose receipts ledger is missing or has claims that aren't done.
inputs:
  pr:
    description: Pull request number
    default: ${{ github.event.pull_request.number }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
      run: python3 "$GITHUB_ACTION_PATH/skills/verification/kip-receipts/receipt.py" check --pr "$PR"
