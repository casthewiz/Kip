[package]
name = "kip-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Native window and tray around Kip's dashboard (receipt.py serve)"
license = "MIT"
publish = false
build = "src/build.rs" # in src/, which kip.py install's app_stamp hashes

[dependencies]
tao = "=0.37.2"
tray-icon = "=0.26.1"
wry = "=0.57.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] } # already in the lock, via tray-icon

[profile.release]
strip = true
