name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04  # oldest runner that still has Python 3.8 builds
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_kip.py
      - run: python skills/verification/kip-receipts/test_receipt.py

  os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python test_kip.py
      - run: python skills/verification/kip-receipts/test_receipt.py

      # kip-app: the Rust shell on macOS and Linux, the pythonw shell on Windows (no Rust there, by design).
      # System packages the pinned wry/tao/tray-icon need to build on Linux (docs/kip-app needs the same list):
      # webkit2gtk-4.1 and libsoup-3.0 (wry), GTK 3 (tao, muda), and an appindicator library, which
      # libappindicator-sys loads at run time (Ayatana's or the original).
      - name: Linux webview and tray packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: actions/cache@v4
        if: runner.os != 'Windows'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo build
        if: runner.os != 'Windows'
        working-directory: app
        run: cargo build --locked
      - name: Windows smoke test
        if: runner.os == 'Windows'
        run: python app/windows/smoke_test.py
